# Builds the standalone LANBoard bundle (lanboard-server + lanboard-client) on
# Windows, Linux and macOS. PyInstaller cannot cross-compile, so every OS
# builds its own bundle from packaging/lanboard.spec.
#
# Each job: install deps -> run the test suite headless -> build -> smoke-test
# the frozen executables (packaging/smoke_test.py) -> upload
# LANBoard-<OS>.zip as a workflow artifact. On macOS it also builds
# LANBoard.app and uploads LANBoard-<version>-macOS.dmg.
#
# The bundle is zipped by us *before* upload: actions/upload-artifact drops
# Unix permission bits and follows symlinks, which would leave non-executable
# binaries and broken Qt frameworks on macOS/Linux. The downloaded artifact
# is therefore a zip that contains LANBoard-<OS>.zip; put that inner zip in
# release/extra/<platform>/ and run packaging/make_release.py.
name: build

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Qt's xcb plugin and its dependencies. The offscreen platform used by
      # the tests needs only EGL/GL/fontconfig, but installing the xcb libs on
      # the build machine also lets PyInstaller bundle the ones that are not
      # on its system-library exclude list (notably libxcb-cursor0, which
      # Qt >= 6.5 needs and which many distros do not install by default).
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip list | grep -i -E "pyside|shiboken|pdfium|pyinstaller|pytest"

      - name: Run tests (headless)
        run: python -m pytest -q

      # Build even when a test failed (the job still ends red), so a single
      # platform-specific test failure does not block getting the executables.
      - name: Build bundle
        id: build
        if: ${{ !cancelled() }}
        run: python -m PyInstaller --noconfirm packaging/lanboard.spec

      - name: Smoke-test frozen executables
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python packaging/smoke_test.py --dist dist/LANBoard --seconds 6

      # macOS: the spec also builds dist/LANBoard.app; wrap it in a .dmg and
      # check its signature and that the bundled server runs from inside it
      - name: Build and check DMG (macOS)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'macOS' }}
        run: |
          codesign --verify --deep --strict dist/LANBoard.app
          dist/LANBoard.app/Contents/MacOS/lanboard-server --help > /dev/null
          python packaging/make_dmg.py

      - name: Upload DMG (macOS)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v4
        with:
          name: LANBoard-macOS-dmg
          path: dist/LANBoard-*-macOS.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Zip bundle (keep permissions and symlinks)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "../LANBoard-$RUNNER_OS.zip" LANBoard
          else
            zip -qry "../LANBoard-$RUNNER_OS.zip" LANBoard
          fi
          cd ..
          ls -l "LANBoard-$RUNNER_OS.zip"
          du -sh dist/LANBoard

      - name: Upload artifact
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: LANBoard-${{ runner.os }}
          path: LANBoard-${{ runner.os }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
