# Attaches the Windows / Linux / macOS bundles of a finished "build" run to a
# GitHub Release, entirely on GitHub's side (no local download/upload).
#
#   gh workflow run release-assets.yml -f run_id=<build run id> -f tag=v0.1.0
name: release-assets

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "id of a successful build workflow run"
        required: true
      tag:
        description: "release tag to attach the files to (the release must exist)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lR artifacts
          gh release upload "${{ inputs.tag }}" --clobber --repo "${{ github.repository }}" \
            artifacts/LANBoard-Windows/LANBoard-Windows.zip \
            artifacts/LANBoard-Linux/LANBoard-Linux.zip \
            artifacts/LANBoard-macOS/LANBoard-macOS.zip
