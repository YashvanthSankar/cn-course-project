<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-label="Deployment: one LANBoard server and N clients on a LAN, TCP 5050 and UDP 5051">
  <style>
    text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 12px; fill: #1e293b; }
    .s { font-size: 11px; fill: #475569; }
    .b { font-weight: 600; }
    .h { font-size: 13px; font-weight: 600; }
    .m { font-family: "JetBrains Mono", Menlo, monospace; font-size: 11px; }
  </style>
  <defs>
    <marker id="d1-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
    <marker id="d1-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
  </defs>

  <!-- LAN boundary -->
  <rect x="10" y="14" width="660" height="372" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="28" y="38" class="h">Local Area Network</text>
  <text x="28" y="54" class="s">one switch, Wi-Fi access point or phone hotspot (same subnet)</text>

  <!-- Internet, not used -->
  <rect x="496" y="26" width="160" height="66" rx="10" fill="#fef2f2" stroke="#f87171" stroke-dasharray="4 3"/>
  <text x="512" y="48" class="b" style="fill:#b91c1c">Internet</text>
  <path d="M630 37 L644 51 M644 37 L630 51" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round"/>
  <text x="512" y="66" class="s">not required: the demo</text>
  <text x="512" y="80" class="s">runs with it disabled</text>

  <!-- Server -->
  <rect x="240" y="74" width="220" height="128" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="256" y="96" class="h">LANBoard server</text>
  <text x="256" y="111" class="m" style="fill:#475569">lanboard-server --port 5050</text>
  <rect x="256" y="120" width="188" height="22" rx="6" fill="#eef2ff" stroke="#818cf8"/>
  <text x="266" y="135" class="s b" style="fill:#3730a3">TCP 5050 · asyncio listener</text>
  <rect x="256" y="148" width="188" height="22" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="266" y="163" class="s b" style="fill:#92400e">UDP 5051 · discovery responder</text>
  <text x="256" y="190" class="s">rooms, op log, chat on disk (--data)</text>

  <!-- UDP discovery from client 1 -->
  <path d="M42 272 V152 H238" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#d1-aa)"/>
  <path d="M238 166 H56 V272" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#d1-aa)"/>
  <text x="62" y="146" class="s" style="fill:#92400e">① UDP broadcast probe → :5051</text>
  <text x="62" y="182" class="s" style="fill:#92400e">② unicast reply: port, rooms</text>

  <!-- TCP links -->
  <line x1="120" y1="272" x2="296" y2="204" stroke="#4f46e5" stroke-width="2" marker-start="url(#d1-ai)" marker-end="url(#d1-ai)"/>
  <line x1="350" y1="272" x2="350" y2="204" stroke="#4f46e5" stroke-width="2" marker-start="url(#d1-ai)" marker-end="url(#d1-ai)"/>
  <line x1="570" y1="272" x2="404" y2="204" stroke="#4f46e5" stroke-width="2" marker-start="url(#d1-ai)" marker-end="url(#d1-ai)"/>
  <text x="358" y="236" class="s b" style="fill:#3730a3">③ TCP :5050</text>
  <text x="358" y="250" class="s">one persistent connection</text>
  <text x="358" y="263" class="s">per client, full duplex</text>

  <!-- Clients -->
  <g>
    <rect x="30" y="274" width="170" height="70" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/>
    <text x="72" y="296" class="b">Client 1 · alice</text>
    <text x="72" y="312" class="s">PySide6 desktop app</text>
    <text x="72" y="327" class="s">QTcpSocket, QUdpSocket</text>
  </g>
  <g>
    <rect x="262" y="274" width="176" height="70" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/>
    <text x="278" y="296" class="b">Client 2 · bob</text>
    <text x="278" y="312" class="s">may also host the server</text>
    <text x="278" y="327" class="s">as a child process</text>
  </g>
  <g>
    <rect x="486" y="274" width="170" height="70" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/>
    <text x="502" y="296" class="b">Client N · …</text>
    <text x="502" y="312" class="s">any number of clients</text>
    <text x="502" y="327" class="s">(server limit 512 sockets)</text>
  </g>

  <!-- Legend -->
  <line x1="30" y1="368" x2="62" y2="368" stroke="#4f46e5" stroke-width="2"/>
  <text x="70" y="372" class="s">TCP: framed protocol, reliable and ordered (all application traffic)</text>
  <line x1="510" y1="368" x2="540" y2="368" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="548" y="372" class="s">UDP: discovery only</text>
</svg>
