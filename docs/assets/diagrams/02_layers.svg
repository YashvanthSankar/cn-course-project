<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" role="img" aria-label="Client and server internal layers">
  <style>
    text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 12px; fill: #1e293b; }
    .s { font-size: 11px; fill: #475569; }
    .b { font-weight: 600; }
    .h { font-size: 13px; font-weight: 600; }
    .m { font-family: "JetBrains Mono", Menlo, monospace; font-size: 10.5px; fill: #64748b; }
  </style>
  <defs>
    <marker id="d2-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="d2-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
  </defs>

  <!-- ===== Client column ===== -->
  <text x="20" y="20" class="h" style="fill:#0f766e">Client process (one per user, Qt event loop)</text>

  <rect x="20" y="32" width="300" height="56" rx="9" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="32" y="51" class="b">UI</text>
  <text x="32" y="66" class="s">MainWindow, TopBar, ToolPalette, People · Chat ·</text>
  <text x="32" y="80" class="s">History · Network panels</text>
  <text x="310" y="51" class="m" text-anchor="end">client/ui/</text>

  <rect x="20" y="110" width="300" height="56" rx="9" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="32" y="129" class="b">Canvas</text>
  <text x="32" y="144" class="s">CanvasView: pan, zoom, tools emit ops</text>
  <text x="32" y="158" class="s">CanvasScene: object id → QGraphicsItem</text>
  <text x="310" y="129" class="m" text-anchor="end">client/canvas/</text>

  <rect x="20" y="188" width="300" height="56" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="32" y="207" class="b">SessionController</text>
  <text x="32" y="222" class="s">board (confirmed, seq order) · view = board + pending</text>
  <text x="32" y="236" class="s">gap buffer · hash check · undo/redo · throttles</text>
  <text x="310" y="207" class="m" text-anchor="end">client/controller.py</text>

  <rect x="20" y="266" width="300" height="56" rx="9" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="32" y="285" class="b">NetClient</text>
  <text x="32" y="300" class="s">handshake · PING 3 s · watchdog · reconnect backoff</text>
  <text x="32" y="314" class="s">FaultInjector (Chaos Lab) · Metrics (HUD)</text>
  <text x="310" y="285" class="m" text-anchor="end">client/net.py</text>

  <rect x="20" y="344" width="300" height="56" rx="9" fill="#f1f5f9" stroke="#64748b"/>
  <text x="32" y="363" class="b">FrameDecoder + QTcpSocket</text>
  <text x="32" y="378" class="s">length-prefixed frames ↔ TCP byte stream</text>
  <text x="32" y="392" class="s">LowDelayOption (TCP_NODELAY), KeepAlive</text>

  <!-- client arrows: calls down, signals up -->
  <g stroke="#475569" stroke-width="1.3" fill="none">
    <line x1="120" y1="90" x2="120" y2="108" marker-end="url(#d2-a)"/>
    <line x1="220" y1="108" x2="220" y2="90" marker-end="url(#d2-a)"/>
    <line x1="120" y1="168" x2="120" y2="186" marker-end="url(#d2-a)"/>
    <line x1="220" y1="186" x2="220" y2="168" marker-end="url(#d2-a)"/>
    <line x1="120" y1="246" x2="120" y2="264" marker-end="url(#d2-a)"/>
    <line x1="220" y1="264" x2="220" y2="246" marker-end="url(#d2-a)"/>
    <line x1="120" y1="324" x2="120" y2="342" marker-end="url(#d2-a)"/>
    <line x1="220" y1="342" x2="220" y2="324" marker-end="url(#d2-a)"/>
  </g>
  <text x="126" y="102" class="s">calls</text>
  <text x="226" y="102" class="s">signals</text>
  <text x="126" y="180" class="s">submit(op)</text>
  <text x="226" y="180" class="s">objects_changed</text>
  <text x="126" y="258" class="s">send(type, p)</text>
  <text x="226" y="258" class="s">message(type, p)</text>
  <text x="126" y="336" class="s">encode()</text>
  <text x="226" y="336" class="s">feed(bytes)</text>

  <!-- ===== Server column ===== -->
  <text x="352" y="20" class="h" style="fill:#3730a3">Server process (one asyncio event loop thread)</text>
  <rect x="352" y="32" width="316" height="290" rx="12" fill="#f8fafc" stroke="#6366f1" stroke-dasharray="5 4"/>

  <rect x="364" y="44" width="292" height="40" rx="9" fill="#eef2ff" stroke="#6366f1"/>
  <text x="376" y="61" class="b">Listener</text>
  <text x="376" y="76" class="s">asyncio.start_server(:5050) · UDP responder :5051</text>

  <rect x="364" y="104" width="292" height="62" rx="9" fill="#eef2ff" stroke="#6366f1"/>
  <text x="376" y="122" class="b">ClientConnection × N</text>
  <text x="376" y="138" class="s">reader: read(64 KiB) → FrameDecoder → dispatch</text>
  <text x="376" y="153" class="s">writer: Queue(4000 frames) → write() → drain()</text>

  <rect x="364" y="186" width="292" height="62" rx="9" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="376" y="204" class="b">Room: the sequencer (one per room code)</text>
  <text x="376" y="220" class="s">seq counter · Board.apply · history / op log</text>
  <text x="376" y="235" class="s">sessions, roles, lock · chat · token buckets</text>

  <rect x="364" y="266" width="292" height="44" rx="9" fill="#eef2ff" stroke="#6366f1"/>
  <text x="376" y="284" class="b">Housekeeping task (1 Hz)</text>
  <text x="376" y="299" class="s">watchdog 12 s · session TTL 600 s · autosave</text>

  <g stroke="#475569" stroke-width="1.3" fill="none">
    <line x1="510" y1="86" x2="510" y2="102" marker-end="url(#d2-a)"/>
    <line x1="470" y1="168" x2="470" y2="184" marker-end="url(#d2-a)"/>
    <line x1="550" y1="184" x2="550" y2="168" marker-end="url(#d2-a)"/>
  </g>
  <text x="476" y="180" class="s">handle()</text>
  <text x="556" y="180" class="s">broadcast</text>

  <!-- storage -->
  <path d="M364 352 a146 10 0 0 0 292 0 v40 a146 10 0 0 1 -292 0 z" fill="#fffbeb" stroke="#d97706"/>
  <ellipse cx="510" cy="352" rx="146" ry="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="376" y="378" class="b">RoomStore: ops.jsonl, snapshot, history, saves</text>
  <text x="376" y="393" class="s">op append inline; snapshot/saves in worker threads</text>
    <path d="M600 312 V340" stroke="#d97706" stroke-width="1.4" fill="none" marker-end="url(#d2-a)"/>
  <text x="594" y="332" class="s" text-anchor="end" style="fill:#92400e">append op · write snapshot</text>

  <!-- TCP between the two processes -->
  <path d="M322 372 H338 V135 H362" fill="none" stroke="#4f46e5" stroke-width="2" marker-start="url(#d2-ai)" marker-end="url(#d2-ai)"/>
  <rect x="326" y="246" width="24" height="44" rx="4" fill="#ffffff"/>
  <text x="338" y="262" class="s b" text-anchor="middle" style="fill:#3730a3">TCP</text>
  <text x="338" y="276" class="s b" text-anchor="middle" style="fill:#3730a3">5050</text>

  <!-- ===== Shared core ===== -->
  <rect x="20" y="428" width="648" height="78" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="34" y="448" class="h">common/: shared by client, server, bot and tests (no Qt)</text>
  <text x="34" y="466" class="s"><tspan class="b" style="fill:#1e293b">protocol.py</tspan> framing, FrameDecoder, multi-part · <tspan class="b" style="fill:#1e293b">messages.py</tspan> MsgType catalogue, Err, Reason</text>
  <text x="34" y="482" class="s"><tspan class="b" style="fill:#1e293b">model.py</tspan> Board.apply (deterministic), validate_op, hash · <tspan class="b" style="fill:#1e293b">undo.py</tspan> per-user undo/redo</text>
  <text x="34" y="498" class="s"><tspan class="b" style="fill:#1e293b">auth.py</tspan> scrypt verifier, HMAC proof · <tspan class="b" style="fill:#1e293b">geometry.py</tspan> RDP, hit tests, Smart Ink · <tspan class="b" style="fill:#1e293b">config.py</tspan> all tunables</text>
  <line x1="170" y1="402" x2="170" y2="426" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <line x1="510" y1="404" x2="510" y2="426" stroke="#94a3b8" stroke-dasharray="3 3"/>
</svg>
