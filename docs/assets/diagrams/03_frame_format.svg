<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" aria-label="Frame format: u32 length, u8 type, JSON payload">
  <style>
    text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 12px; fill: #1e293b; }
    .s { font-size: 11px; fill: #475569; }
    .b { font-weight: 600; }
    .h { font-size: 13px; font-weight: 600; }
    .m { font-family: "JetBrains Mono", Menlo, monospace; font-size: 11.5px; fill: #1e293b; }
    .ms { font-family: "JetBrains Mono", Menlo, monospace; font-size: 11px; fill: #64748b; }
  </style>

  <text x="20" y="22" class="h">One frame on the TCP byte stream</text>

  <!-- byte offsets -->
  <text x="20" y="44" class="ms">byte 0</text>
  <text x="220" y="44" class="ms" text-anchor="middle">4</text>
  <text x="300" y="44" class="ms" text-anchor="middle">5</text>
  <text x="660" y="44" class="ms" text-anchor="end">4 + N</text>

  <!-- header + payload boxes -->
  <rect x="20" y="52" width="200" height="56" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <line x1="70" y1="52" x2="70" y2="62" stroke="#818cf8"/><line x1="120" y1="52" x2="120" y2="62" stroke="#818cf8"/><line x1="170" y1="52" x2="170" y2="62" stroke="#818cf8"/>
  <text x="120" y="78" class="b" text-anchor="middle">length N</text>
  <text x="120" y="96" class="s" text-anchor="middle">uint32, big-endian (network order)</text>

  <rect x="220" y="52" width="80" height="56" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="260" y="78" class="b" text-anchor="middle">type</text>
  <text x="260" y="96" class="s" text-anchor="middle">uint8</text>

  <rect x="300" y="52" width="360" height="56" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/>
  <text x="480" y="78" class="b" text-anchor="middle">payload: N − 1 bytes</text>
  <text x="480" y="96" class="s" text-anchor="middle">one UTF-8 JSON object, compact separators (",", ":")</text>

  <!-- brace for N -->
  <path d="M222 116 v6 h218 v6 m0 -6 h218 v-6" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <text x="660" y="144" class="s" text-anchor="end">N counts the type byte plus the payload · 1 ≤ N ≤ MAX_FRAME = 8 MiB, otherwise ProtocolError</text>

  <!-- example -->
  <text x="20" y="178" class="h">Example: HELLO, 73 bytes on the wire</text>
  <rect x="20" y="188" width="200" height="34" fill="#ffffff" stroke="#4f46e5"/>
  <text x="120" y="210" class="m" text-anchor="middle">00 00 00 45</text>
  <rect x="220" y="188" width="80" height="34" fill="#ffffff" stroke="#d97706"/>
  <text x="260" y="210" class="m" text-anchor="middle">01</text>
  <rect x="300" y="188" width="360" height="34" fill="#ffffff" stroke="#0d9488"/>
  <text x="310" y="210" class="m">{"proto":1,"app":"lanboard","usern…</text>
  <text x="120" y="240" class="s" text-anchor="middle">0x45 = 69 = 1 + 68</text>
  <text x="260" y="240" class="s" text-anchor="middle">0x01 = HELLO</text>
  <text x="480" y="240" class="s" text-anchor="middle">68 bytes of JSON</text>

  <!-- type groups -->
  <text x="20" y="272" class="h">Type byte: the high nibble groups the messages</text>
  <g>
    <rect x="20"  y="282" width="86" height="34" rx="6" fill="#eef2ff" stroke="#818cf8"/>
    <text x="63"  y="297" class="b" text-anchor="middle">0x0_</text><text x="63" y="310" class="s" text-anchor="middle">control</text>
    <rect x="112" y="282" width="86" height="34" rx="6" fill="#f0fdfa" stroke="#2dd4bf"/>
    <text x="155" y="297" class="b" text-anchor="middle">0x1_</text><text x="155" y="310" class="s" text-anchor="middle">presence</text>
    <rect x="204" y="282" width="86" height="34" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="247" y="297" class="b" text-anchor="middle">0x2_</text><text x="247" y="310" class="s" text-anchor="middle">board ops</text>
    <rect x="296" y="282" width="86" height="34" rx="6" fill="#fdf4ff" stroke="#d946ef"/>
    <text x="339" y="297" class="b" text-anchor="middle">0x3_</text><text x="339" y="310" class="s" text-anchor="middle">chat</text>
    <rect x="388" y="282" width="86" height="34" rx="6" fill="#fef2f2" stroke="#f87171"/>
    <text x="431" y="297" class="b" text-anchor="middle">0x4_</text><text x="431" y="310" class="s" text-anchor="middle">admin</text>
    <rect x="480" y="282" width="86" height="34" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="523" y="297" class="b" text-anchor="middle">0x5_</text><text x="523" y="310" class="s" text-anchor="middle">saves, history</text>
    <rect x="572" y="282" width="88" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="616" y="297" class="b" text-anchor="middle">0x6_</text><text x="616" y="310" class="s" text-anchor="middle">image blobs</text>
  </g>
</svg>
