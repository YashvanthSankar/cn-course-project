<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" role="img" aria-label="Per-user undo with concurrent edits">
  <style>
    text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 12px; fill: #1e293b; }
    .s { font-size: 11px; fill: #475569; }
    .b { font-weight: 600; }
    .h { font-size: 13px; font-weight: 600; }
    .m { font-family: "JetBrains Mono", Menlo, monospace; font-size: 11px; fill: #334155; }
  </style>
  <defs>
    <marker id="d8-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
  </defs>

  <!-- op log -->
  <text x="14" y="20" class="h">Shared op log (server order)</text>
  <line x1="40" y1="34" x2="40" y2="392" stroke="#cbd5e1" stroke-width="2"/>

  <g>
    <circle cx="40" cy="48" r="5" fill="#0d9488"/>
    <rect x="54" y="34" width="268" height="28" rx="6" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="62" y="52" class="m">10</text><text x="88" y="52"><tspan class="b" style="fill:#1f57c3">Alice</tspan><tspan class="s"> add stroke A1</tspan></text>
  </g>
  <g>
    <circle cx="40" cy="86" r="5" fill="#b45309"/>
    <rect x="54" y="72" width="268" height="28" rx="6" fill="#fdf6ec" stroke="#f0c48a"/>
    <text x="62" y="90" class="m">11</text><text x="88" y="90"><tspan class="b" style="fill:#92400e">Bob</tspan><tspan class="s"> add rectangle B1 (black)</tspan></text>
  </g>
  <g>
    <circle cx="40" cy="124" r="5" fill="#0d9488"/>
    <rect x="54" y="110" width="268" height="28" rx="6" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="62" y="128" class="m">12</text><text x="88" y="128"><tspan class="b" style="fill:#1f57c3">Alice</tspan><tspan class="s"> B1.color: black → red</tspan></text>
  </g>
  <g>
    <circle cx="40" cy="162" r="5" fill="#b45309"/>
    <rect x="54" y="148" width="268" height="28" rx="6" fill="#fdf6ec" stroke="#f0c48a"/>
    <text x="62" y="166" class="m">13</text><text x="88" y="166"><tspan class="b" style="fill:#92400e">Bob</tspan><tspan class="s"> B1.color: red → green</tspan></text>
  </g>

  <text x="54" y="200" class="s b" style="fill:#1f57c3">Alice presses Ctrl+Z</text>
  <g>
    <circle cx="40" cy="226" r="5" fill="#0d9488"/>
    <rect x="54" y="212" width="268" height="28" rx="6" fill="#ccfbf1" stroke="#0d9488"/>
    <text x="62" y="230" class="m">14</text><text x="88" y="230"><tspan class="b" style="fill:#1f57c3">Alice</tspan><tspan class="s"> delete A1 (inverse of seq 10)</tspan></text>
  </g>

  <text x="54" y="264" class="s b" style="fill:#92400e">Bob presses Ctrl+Z</text>
  <g>
    <circle cx="40" cy="290" r="5" fill="#b45309"/>
    <rect x="54" y="276" width="268" height="28" rx="6" fill="#fdf1e3" stroke="#b45309"/>
    <text x="62" y="294" class="m">15</text><text x="88" y="294"><tspan class="b" style="fill:#92400e">Bob</tspan><tspan class="s"> B1.color: green → red (inverse of 13)</tspan></text>
  </g>

  <text x="54" y="328" class="s b" style="fill:#1f57c3">Alice presses Ctrl+Shift+Z (redo)</text>
  <g>
    <circle cx="40" cy="354" r="5" fill="#0d9488"/>
    <rect x="54" y="340" width="268" height="28" rx="6" fill="#ccfbf1" stroke="#0d9488"/>
    <text x="62" y="358" class="m">16</text><text x="88" y="358"><tspan class="b" style="fill:#1f57c3">Alice</tspan><tspan class="s"> restore A1</tspan></text>
  </g>
  <rect x="14" y="384" width="308" height="76" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="26" y="403" class="b" style="fill:#15803d">Board after seq 16, on every replica</text>
  <text x="26" y="420" class="s">A1 is live again and B1 is red. Undo and redo are</text>
  <text x="26" y="435" class="s">ordinary new ops with their own seq, so all clients</text>
  <text x="26" y="450" class="s">converge exactly as for any other edit.</text>

  <!-- Alice reasoning -->
  <rect x="340" y="34" width="330" height="166" rx="8" fill="#ffffff" stroke="#0d9488"/>
  <text x="352" y="54" class="b" style="fill:#1f57c3">Alice's undo stack (newest on top)</text>
  <rect x="352" y="62" width="306" height="22" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="360" y="77" class="m">update B1 {style.color: red} prev {black}</text>
  <rect x="352" y="88" width="306" height="22" rx="4" fill="#f0fdf4" stroke="#86efac"/>
  <text x="360" y="103" class="m">add A1</text>
  <text x="352" y="128" class="s"><tspan class="b" style="fill:#b91c1c">1. skipped:</tspan> B1.color is green now, not Alice's red.</text>
  <text x="352" y="143" class="s">Bob changed it later, so reverting would erase his edit.</text>
  <text x="352" y="163" class="s"><tspan class="b" style="fill:#15803d">2. used:</tspan> inverse of "add A1" is "delete A1"; A1 is</text>
  <text x="352" y="178" class="s">still live, so it is submitted (seq 14) and pushed on redo.</text>
  <text x="352" y="193" class="s">B1 is not touched.</text>

  <!-- Bob reasoning -->
  <rect x="340" y="212" width="330" height="108" rx="8" fill="#ffffff" stroke="#b45309"/>
  <text x="352" y="232" class="b" style="fill:#92400e">Bob's undo stack</text>
  <rect x="352" y="240" width="306" height="22" rx="4" fill="#f0fdf4" stroke="#86efac"/>
  <text x="360" y="255" class="m">update B1 {style.color: green} prev {red}</text>
  <text x="352" y="280" class="s"><tspan class="b" style="fill:#15803d">used:</tspan> B1.color is still Bob's green, so the inverse</text>
  <text x="352" y="295" class="s">sets it back to red, the value he replaced (seq 15).</text>
  <text x="352" y="310" class="s">Bob's undo never touches Alice's stroke A1.</text>

  <!-- rules -->
  <rect x="340" y="332" width="330" height="128" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="352" y="350" class="b">Rules (common/undo.py)</text>
  <text x="352" y="366" class="s">• each user undoes only their own actions</text>
  <text x="352" y="380" class="s">• undo = inverse op filtered against the current board:</text>
  <text x="362" y="394" class="s">skip if the object was erased or the property changed</text>
  <text x="352" y="408" class="s">• nothing to undo there → try the next entry</text>
  <text x="352" y="422" class="s">• new action clears redo · one stroke or batch = one step</text>
  <text x="352" y="436" class="s">• clear is undoable (restores the ids it deleted)</text>
  <text x="352" y="450" class="s">• load / restore-version (replace) is not undoable</text>
</svg>
